name: Build Debug APK

on:
  push:
    branches:
      - '**' # Triggers on push to any branch
  pull_request:
    branches:
      - '**' # Triggers on PR to any branch
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from repository base64 file..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, falling back to auto-generation..."
          fi

      - name: Create build-time secrets file (.env)
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Using injected GEMINI_API_KEY secret..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "No GEMINI_API_KEY secret found. Generating default fallback..."
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Find and Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            "app/build/outputs/apk/debug/app-debug.apk#myra-assistant-debug.apk" \
            --title "MYRA Assistant Debug APK $TAG_NAME" \
            --notes "Automated build of Debug APK from branch ${{ github.ref_name }}. Commit: ${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### MYRA Assistant Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Compilation**: Succeeded :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Upload**: Succeeded :white_check_mark: (APK uploaded successfully as a workflow artifact)" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            TAG_NAME="v1.0.${{ github.run_number }}"
            echo "===================================================="
            echo "SUCCESS: GitHub Release was published successfully!"
            echo "===================================================="
            gh release view "$TAG_NAME"
            
            # Fetch and display the exact URL of the uploaded APK asset
            ASSET_URL=$(gh release view "$TAG_NAME" --json assets --jq '.assets[0].url')
            echo "Download URL for the APK: $ASSET_URL"
            
            echo "- **GitHub Release**: Published successfully :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "- **Download APK Release Asset**: [$ASSET_URL]($ASSET_URL)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning:: GitHub Release step failed. Please note that the APK is still safely available as an artifact."
            echo "===================================================="
            echo "WARNING: The GitHub Release step failed or was skipped."
            echo "However, the compiled APK is still safely available!"
            echo "You can download it as a workflow artifact from this action run."
            echo "To download:"
            echo "1. Go to the Summary tab of this GitHub Actions run."
            echo "2. Scroll down to the 'Artifacts' section."
            echo "3. Click on 'myra-assistant-debug-apk' to download the ZIP file containing the APK."
            echo "===================================================="
            
            echo "- **GitHub Release**: Failed or Skipped :warning: (But APK is still safely available as a workflow artifact below)" >> $GITHUB_STEP_SUMMARY
          fi

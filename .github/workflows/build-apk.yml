name: Build Debug APK

on:
  push:
    branches:
      - '**' # Triggers on push to any branch
  pull_request:
    branches:
      - '**' # Triggers on PR to any branch
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Decode Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from repository base64 file..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, falling back to auto-generation..."
          fi

      - name: Create build-time secrets file (.env)
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Using injected GEMINI_API_KEY secret..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "No GEMINI_API_KEY secret found. Generating default fallback..."
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Find and Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myra-assistant-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

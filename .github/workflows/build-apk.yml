name: Build Debug APK

on:
  push:
    branches:
      - '**' # Triggers on push to any branch
  pull_request:
    branches:
      - '**' # Triggers on PR to any branch
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Active Java Version
        run: java -version

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create Temporary Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from repository base64 file..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "debug.keystore.base64 not found, generating temporary debug keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Create build-time secrets file (.env)
        run: |
          if [ -n "${{ secrets.GEMINI_API_KEY }}" ]; then
            echo "Using injected GEMINI_API_KEY secret..."
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
          else
            echo "No GEMINI_API_KEY secret found. Generating default fallback..."
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env
          fi

      - name: Build Debug APK with Gradle
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Find and Upload Compiled Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        id: create_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            --target "${{ github.sha }}" \
            --title "MYRA Assistant Debug APK $TAG_NAME" \
            --notes "Automated build of Debug APK from branch ${{ github.ref_name }}. Commit: ${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          
          if [ "${{ steps.create_release.outcome }}" = "success" ]; then
            echo "Retrieving release details using gh release view..."
            RELEASE_INFO=$(gh release view "$TAG_NAME" --json tagName,name,url,assets)
            
            TAG=$(echo "$RELEASE_INFO" | jq -r '.tagName')
            TITLE=$(echo "$RELEASE_INFO" | jq -r '.name')
            URL=$(echo "$RELEASE_INFO" | jq -r '.url')
            APK_NAME=$(echo "$RELEASE_INFO" | jq -r '.assets[0].name')
            
            echo "=================================================="
            echo "Release Tag: $TAG"
            echo "Release Title: $TITLE"
            echo "Release Page URL: $URL"
            echo "APK Asset Filename: $APK_NAME"
            echo "=================================================="
            
            echo "### :white_check_mark: Build & Release Succeeded!" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag**: \`$TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title**: $TITLE" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Page URL**: [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset Filename**: \`$APK_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the **Assets** section of the release page." >> $GITHUB_STEP_SUMMARY
            echo "As a backup, the standard Actions artifact **app-debug-apk** is also available for this run." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning:: GitHub Release publishing failed."
            echo "=================================================="
            echo "WARNING: GitHub Release publishing failed."
            echo "However, the APK build succeeded!"
            echo "The Actions artifact named 'app-debug-apk' remains available as a backup."
            echo "=================================================="
            
            echo "### :warning: Release Publishing Failed (But APK Build Succeeded!)" >> $GITHUB_STEP_SUMMARY
            echo "The GitHub Release could not be created automatically. However, the APK was compiled successfully." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "- **Actions Artifact Name**: \`app-debug-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "You can download the APK directly as a workflow artifact from the Summary page of this run." >> $GITHUB_STEP_SUMMARY
          fi
